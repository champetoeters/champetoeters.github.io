<!--
  tickets — four formulas in one basket, and four views: your e-mail + a named
  ticket per person → versturen → how to pay → gereserveerd. No <form>, so
  nothing here can navigate on its own.

  Every ticket is on a person's name (client): the wristband handed over at the
  door has to match that person's formula, so a bare quantity is not enough.

  There are no card fields and no provider redirect: the order is stored by the
  backend (backend/API.md), which mails the confirmation, and the payment panel
  shows the transfer details. What this page may do is decided by
  ?action=health → orders — see js/tickets.js.
-->
<section id="tickets" class="section" data-section="tickets" lang="nl"
         aria-labelledby="tk-title">
  <div class="tk">
    <div class="u-container u-container--narrow tk__inner">

      <header class="tk__head">
        <p class="u-eyebrow tk__eyebrow" id="tk-when">ZA 5 SEPT 2026 · TC LEIEMEERS</p>
        <h1 class="u-display tk__title" id="tk-title">Open air ticket</h1>
        <p class="tk__price">
          <span class="tk__per">vanaf</span>
          <span class="tk__cur" aria-hidden="true">€</span><span class="tk__amt u-tabular">3</span>
        </p>
      </header>

      <!-- ---------- 1. kopen ----------
           .glass--frost, not the default panel: the stronger rim comes back via
           custom properties in tickets.css, never a competing backdrop-filter. -->
      <div class="tk-view tk-buy glass glass--panel glass--frost" data-view="form" id="tk-buy">

        <!-- Where the confirmation goes. The buyer's own name is NOT asked
             (client, r11): every ticket already carries the name of the person
             it is for, and asking the orderer to type their name a second time
             on top of that was the one redundant field on this page. -->
        <div class="tk-fields">
          <div class="glass-field">
            <label class="glass-label" for="tk-email">E-mailadres</label>
            <input class="glass-input" id="tk-email" name="email" type="email"
                   maxlength="160" autocomplete="email" inputmode="email"
                   enterkeyhint="done" aria-describedby="tk-email-hint tk-email-err">
            <!-- Says whose address this is. With the buyer's own name gone,
                 a bare "E-mailadres" above a list of OTHER people's names
                 leaves it open whether it is the buyer's or the holder's. -->
            <p class="glass-hint" id="tk-email-hint">Hierheen sturen we je bevestiging.</p>
            <p class="glass-error tk-err" id="tk-email-err" hidden></p>
          </div>
        </div>

        <!-- The basket. One row per ticket: a name and a formula, because every
             ticket is on a person and the wristband handed over at the door has
             to match that person's formula. tickets.js builds the rows and the
             <option>s (from data/tickets.json) — the markup ships with none. -->
        <div class="tk-basket" id="tk-basket" role="group" aria-labelledby="tk-basket-k">
          <p class="tk-basket__k" id="tk-basket-k">Tickets</p>
          <ol class="tk-rows" id="tk-rows"></ol>
          <button type="button" class="tk-add" id="tk-add">+ Nog een ticket</button>
        </div>

        <p class="tk-tot" id="tk-tot" hidden></p>

        <!-- Something that is not about a field: it stays until the next
             keystroke, so a failed send cannot be recomputed away. -->
        <p class="tk-err tk-notice" id="tk-notice" hidden></p>

        <!-- The one action. Label, amount and closed state are written by
             tickets.js once the health probe has said whether sales are open.
             Ships in the WAITING state (action label, dimmed): the fragment
             paints before js/tickets.js has loaded, and "nog niet open"
             flashing first read as a glitch — closed is only ever printed
             as an answer. -->
        <button type="button" class="glass-btn glass-btn--primary tk-pay is-wait"
                id="tk-pay" aria-disabled="true">
          <span class="tk-pay__label" id="tk-pay-label">Tickets reserveren</span>
          <span class="tk-pay__dot" aria-hidden="true">·</span>
          <span class="tk-pay__amt u-tabular" id="tk-pay-amt">€3</span>
        </button>
      </div>

      <!-- ---------- 2. versturen ---------- -->
      <div class="tk-view tk-buy glass glass--panel glass--frost tk-proc"
           data-view="processing" hidden>
        <span class="champ-bubbles" aria-hidden="true"><i></i><i></i><i></i></span>
        <p class="tk-proc__title" id="tk-proc-msg">Versturen…</p>
      </div>

      <!-- ---------- 3. betalen — js/payinfo.js fills the panel ---------- -->
      <div class="tk-view tk-flow" data-view="pay" hidden>
        <!-- js/payinfo.js adds .pay .glass .glass--panel here; --edge stays. -->
        <div class="glass--edge" id="tk-pay-panel"></div>
        <button type="button" class="glass-btn glass-btn--primary tk-flow__btn"
                id="tk-pay-ok">Oké, begrepen</button>
      </div>

      <!-- ---------- 4. gereserveerd ----------
           Only ever revealed after the backend answered ok. -->
      <div class="tk-view tk-flow" data-view="done" hidden>
        <div class="tk-done glass glass--panel glass--edge">
          <p class="u-eyebrow tk-done__hd">
            <span class="tk-done__check" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 20 20" focusable="false">
                <path d="M4.5 10.5l3.6 3.6L15.5 6.5" fill="none" stroke="currentColor"
                      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            Gereserveerd
          </p>
          <h2 class="tk-done__title" tabindex="-1" id="tk-done-title">Je tickets zijn gereserveerd</h2>
          <p class="tk-done__lead" id="tk-done-recap"></p>
          <!-- tickets.js rewrites this when the backend says the mail did NOT
               leave (mailed:false) — the page never claims a mail that died. -->
          <p class="tk-done__lead" id="tk-done-mail">Bevestiging in je mailbox. Betaald&nbsp;=&nbsp;binnen.</p>
          <!-- The payment details survive the payment view: bedrag · rekening ·
               mededeling, written by tickets.js via PayInfo.recap(). -->
          <p class="tk-done__pay" id="tk-done-pay"></p>
          <p class="tk-done__foot" id="tk-done-contact"></p>
        </div>

        <a class="glass-btn glass-btn--primary tk-flow__btn" href="/">Terug naar de startpagina</a>
      </div>

      <p class="tk__fine"><a href="/register/">Team inschrijven</a></p>
      <p class="tk-sr" id="tk-live" role="status" aria-live="polite"></p>

    </div><!-- /.u-container -->
  </div><!-- /.tk -->
</section>
